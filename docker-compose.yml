services:
  retaule:
    image: nginxinc/nginx-unprivileged:1.30.6-alpine3.24
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Adreça de Home Assistant a la xarxa local, sense http://
      HA_HOST: 192.168.1.100:8123
      NGINX_ENTRYPOINT_QUIET_LOGS: "1"
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./nginx:/etc/nginx/templates:ro
      - ./config.js:/etc/pantalla/config.js:ro
